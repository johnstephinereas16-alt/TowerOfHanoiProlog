<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tower of Hanoi</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Tower of Hanoi</h1>
  <p class="name">John Stephine C. Reas</p>

  <div class="controls">
    Disks: <input id="disks" type="number" min="1" max="10" value="3" />
    <button id="newBtn">New Game</button>
    <button id="solveBtn">Auto Solve</button>
    <button id="skipBtn" disabled>Skip &raquo;</button>
  </div>

  <div class="info">
    Moves: <span id="moves">0</span>
    &nbsp; Best: <span id="best">7</span>
  </div>

  <p id="status" class="status"></p>

  <div class="main">
  <div class="board" id="board">
    <div class="tower" data-tower="a"><div class="peg"></div><div class="base"></div><span class="label">1</span></div>
    <div class="tower" data-tower="b"><div class="peg"></div><div class="base"></div><span class="label">2</span></div>
    <div class="tower" data-tower="c"><div class="peg"></div><div class="base"></div><span class="label">3</span></div>
    <div id="overlay" class="overlay hidden"></div>
  </div>

  <div class="tracer">
    <h3>Move Tracer</h3>
    <ol id="trace"></ol>
  </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
